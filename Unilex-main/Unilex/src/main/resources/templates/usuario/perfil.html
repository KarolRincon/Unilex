<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Unilex - Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4">
                <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                    <i class="fa-solid fa-circle-user fa-4x text-primary me-3"></i>
                    <div>
                        <h3 class="mb-0 fw-bold" th:text="${nombre}">Abogado</h3>
                        <span class="badge bg-success" th:text="${plan}">Plan Activo</span>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="fw-semibold text-muted">Correo Electrónico:</label>
                        <p class="fs-6" th:text="${email}"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-semibold text-muted">Tarjeta Profesional:</label>
                        <p class="fs-6" th:text="${tarjetaProfesional}"></p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-semibold text-muted">Procesos en Monitoreo:</label>
                        <p class="fs-6 fw-bold text-primary" th:text="${procesosMonitoreados}"></p>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between">
                    <a th:href="@{/procesos/lista}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Volver</a>
                    <a th:href="@{/login}" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
