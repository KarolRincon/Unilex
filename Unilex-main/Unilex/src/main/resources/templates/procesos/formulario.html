<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${proceso.id != null} ? 'Unilex - Editar Proceso' : 'Unilex - Nuevo Proceso'">Unilex</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-blue: #1E40AF;
            --light-bg: #F8FAFC;
        }
        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 76px;
        }
        .navbar-custom {
            background-color: var(--primary-navy);
        }
        .brand-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #FFFFFF !important;
        }
        .form-card {
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .footer-custom {
            background-color: var(--primary-navy);
            color: #94A3B8;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">


<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top shadow">
    <div class="container">
        <a class="navbar-brand brand-logo d-flex align-items-center" th:href="@{/procesos/lista}">
            <i class="fa-solid fa-scale-balanced me-2 text-warning"></i> UNILEX
        </a>
        <div class="d-flex align-items-center text-light ms-auto">
            <a th:href="@{/procesos/lista}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Volver a Lista</a>
        </div>
    </div>
</nav>

<!-- Formulario -->
<div class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card form-card p-4">
                <div class="border-bottom pb-3 mb-4">
                    <h4 class="fw-bold text-dark mb-1" th:text="${proceso.id != null} ? 'Editar Proceso Judicial' : 'Registrar Nuevo Proceso Judicial'"></h4>
                    <p class="text-muted small mb-0">Ingrese los datos oficiales para iniciar la vigilancia del expediente.</p>
                </div>

                <form th:action="@{/procesos/guardar}" th:object="${proceso}" method="post">
                    <!-- ID Oculto para actualización -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="numeroRadicado" class="form-label fw-semibold">Número de Radicado (23 dígitos):</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-hashtag text-muted"></i></span>
                            <input type="text" id="numeroRadicado" th:field="*{numeroRadicado}" class="form-control" placeholder="Ej: 11001400300120260000100" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="despacho" class="form-label fw-semibold">Despacho Judicial:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-building-columns text-muted"></i></span>
                            <input type="text" id="despacho" th:field="*{despacho}" class="form-control" placeholder="Ej: Juzgado 01 Civil Municipal de Bogotá" required />
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="tipoProceso" class="form-label fw-semibold">Tipo de Proceso:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-file-contract text-muted"></i></span>
                            <input type="text" id="tipoProceso" th:field="*{tipoProceso}" class="form-control" placeholder="Ej: Ejecutivo / Verbal Sumario / Tutela" required />
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a th:href="@{/procesos/lista}" class="btn btn-light border">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4" th:text="${proceso.id != null} ? 'Actualizar Proceso' : 'Guardar Proceso'"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer-custom py-4 mt-auto">
    <div class="container text-center">
        <p class="small mb-0">&copy; 2026 Unilex LegalTech. Todos los derechos reservados.</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
