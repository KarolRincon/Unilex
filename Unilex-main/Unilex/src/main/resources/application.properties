# Nombre de la aplicación
spring.application.name=unilex

# Puerto de ejecución
server.port=8080

# Perfil activo
spring.profiles.active=dev

# Nivel de Log DEBUG para el paquete del proyecto (com.unilex.app.Unilex)
logging.level.com.unilex.app.Unilex=DEBUG

# ==========================================
# Configuración Base de Datos H2 (Persistencia)
# ==========================================
# Almacena los datos en un archivo local dentro del proyecto (./data/unilexdb) para que no se borren al reiniciar
spring.datasource.url=jdbc:h2:file:./data/unilexdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Permite acceder a la consola web en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configuración JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Crea y actualiza las tablas dinámicamente según tus @Entity sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true