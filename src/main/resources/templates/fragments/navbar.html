<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Definición del fragmento 'menuPrincipal' -->
<nav th:fragment="menuPrincipal" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
    <div class="container">
        <!-- Clic en el logo redirige siempre a la página principal '/' -->
        <a class="navbar-brand brand-logo d-flex align-items-center fw-bold" th:href="@{/}">
            <i class="fa-solid fa-scale-balanced me-2 text-warning"></i> UNILEX
        </a>

        <!-- Botón desplegable para pantallas móviles/pequeñas -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/procesos/lista}">Procesos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/actuaciones}">Actuaciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/asistente-ia}">
                        <i class="fa-solid fa-robot me-1"></i> Asistente IA <span class="badge bg-warning text-dark small">PRO</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/quienes-somos}">Quiénes Somos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/servicios}">Servicios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/planes}">Planes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/consultas}">Consultas</a>
                </li>
            </ul>

            <!-- Sesión NO iniciada -->
            <div class="d-flex gap-2" th:if="${usuarioNombre == null}">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a th:href="@{/registro}" class="btn btn-warning btn-sm fw-semibold">Registrarse</a>
            </div>

            <!-- Sesión INICIADA -->
            <div class="d-flex align-items-center" th:if="${usuarioNombre != null}">
                <a th:href="@{/perfil}" class="btn btn-outline-light btn-sm d-flex align-items-center">
                    <i class="fa-solid fa-circle-user fa-lg me-2 text-warning"></i>
                    <span th:text="${usuarioNombre}">Nombre del Usuario</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap dentro del fragmento para reactivar la interactividad -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</nav>

</body>
</html>
