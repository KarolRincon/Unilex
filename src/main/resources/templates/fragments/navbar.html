<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>

<nav th:fragment="menuPrincipal" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
    <div class="container">
        <a class="navbar-brand brand-logo d-flex align-items-center fw-bold" th:href="@{/}">
            <i class="fa-solid fa-scale-balanced me-2 text-warning"></i> UNILEX
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/procesos/lista}">Procesos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/actuaciones}">Actuaciones</a></li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/asistente-ia}">
                        <i class="fa-solid fa-robot me-1"></i> Asistente IA
                    </a>
                </li>
            </ul>

            <!-- Selector de Tema (Cookie Preference) -->
            <div class="dropdown me-3">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle text-light" type="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-circle-half-stroke me-1"></i> Tema
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/cambiar-tema(tema='claro')}"><i class="fa-solid fa-sun me-2"></i>Claro</a></li>
                    <li><a class="dropdown-item" th:href="@{/cambiar-tema(tema='oscuro')}"><i class="fa-solid fa-moon me-2"></i>Oscuro</a></li>
                </ul>
            </div>

            <!-- Control de Sesión (HttpSession) -->
            <div class="d-flex gap-2" th:if="${session.usuarioNombre == null}">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a th:href="@{/registro}" class="btn btn-warning btn-sm fw-semibold">Registrarse</a>
            </div>

            <div class="d-flex align-items-center gap-2" th:if="${session.usuarioNombre != null}">
                    <span class="badge bg-secondary py-2 px-3 fw-normal">
                        <i class="fa-solid fa-user me-1 text-warning"></i>
                        <span th:text="${session.usuarioNombre}">Usuario</span>
                    </span>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
