<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Unilex - Formulario de Proceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { background-color: #F8FAFC; padding-top: 80px; } </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: menuPrincipal}"></div>

<div class="container my-4" style="max-width: 650px;">
    <div class="card p-4 bg-white shadow-sm border-0 rounded-3">
        <h4 class="fw-bold mb-3 text-dark">
            <i class="fa-solid fa-folder-plus text-primary me-2"></i>
            <span th:text="${proceso.id == null ? 'Registrar Nuevo Proceso' : 'Editar Proceso'}">Formulario</span>
        </h4>

        <form th:action="@{/procesos/guardar}" th:object="${proceso}" method="post">
            <input type="hidden" th:field="*{id}" />

            <!-- Número de Radicado con Validación -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Número de Radicado (23 dígitos)</label>
                <input type="text"
                       th:field="*{numeroRadicado}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('numeroRadicado')} ? 'is-invalid'"
                       placeholder="Ej: 11001400300120230012300" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroRadicado')}" th:errors="*{numeroRadicado}"></div>
            </div>

            <!-- Despacho Judicial -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Despacho Judicial</label>
                <select th:field="*{despacho}" class="form-select" th:classappend="${#fields.hasErrors('despacho')} ? 'is-invalid'">
                    <option value="" disabled selected>-- Seleccione un Despacho --</option>
                    <option value="Juzgado 01 Civil del Circuito de Bogotá">Juzgado 01 Civil del Circuito de Bogotá</option>
                    <option value="Juzgado 02 Laboral del Circuito de Bogotá">Juzgado 02 Laboral del Circuito de Bogotá</option>
                    <option value="Tribunal Administrativo de Cundinamarca">Tribunal Administrativo de Cundinamarca</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('despacho')}" th:errors="*{despacho}"></div>
            </div>

            <!-- Tipo de Proceso -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Tipo de Proceso</label>
                <select th:field="*{tipoProceso}" class="form-select" th:classappend="${#fields.hasErrors('tipoProceso')} ? 'is-invalid'">
                    <option value="" disabled selected>-- Seleccione el Tipo --</option>
                    <option value="Ejecutivo Singular">Ejecutivo Singular</option>
                    <option value="Ordinario Laboral">Ordinario Laboral</option>
                    <option value="Acción de Tutela">Acción de Tutela</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoProceso')}" th:errors="*{tipoProceso}"></div>
            </div>

            <!-- Relación: Select de Abogado Responsable -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Abogado Responsable</label>
                <select th:field="*{abogado}" class="form-select" th:classappend="${#fields.hasErrors('abogado')} ? 'is-invalid'">
                    <option value="" disabled selected>-- Seleccione un Abogado --</option>
                    <option th:each="abg : ${abogados}" th:value="${abg.id}" th:text="${abg.nombre + ' (' + abg.especialidad + ')'}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('abogado')}" th:errors="*{abogado}"></div>
            </div>

            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-primary w-100">Guardar Proceso</button>
                <a th:href="@{/procesos/lista}" class="btn btn-outline-secondary w-100">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
